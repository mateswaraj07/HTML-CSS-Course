<!DOCTYPE html>
<html>

<head>
  <title>8e - Uber Request a Ride</title>

  <style>
    .uber {
      width: 550px;
    }

    .title {
      font-family: Arial;
      font-size: 45px;
      font-weight: normal;
      margin-top: 0;
      margin-bottom: 35px;
    }

    .location {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 18px 25px;
      margin-bottom: 12px;
      border: none;
      background-color: #eeeeee;
      font-size: 18px;
    }

    .request-button {
      margin-top: 40px;
      padding: 18px 30px;
      background-color: black;
      color: white;
      border: none;
      font-size: 18px;
    }

    .schedule-button {
      margin-top: 40px;
      margin-left: 25px;
      padding: 18px 30px;
      background-color: #eeeeee;
      color: black;
      border: none;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="uber">

    <h1 class="title">
      Request a ride now
    </h1>

    <input
      class="location"
      type="text"
      placeholder="Enter pickup location"
    >

    <input
      class="location"
      type="text"
      placeholder="Enter destination"
    >

    <button class="request-button">
      Request now
    </button>

    <button class="schedule-button">
      Schedule for later
    </button>

  </div>

</body>

</html>
