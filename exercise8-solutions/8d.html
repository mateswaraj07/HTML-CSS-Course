<!DOCTYPE html>
<html>

<head>
  <title>8d - Sign Up Form</title>

  <style>
    .signup {
      width: 500px;
    }

    .name-box {
      width: 235px;
      padding: 15px;
      font-size: 20px;
      border: 2px solid #ccc;
      border-radius: 10px;
      box-sizing: border-box;
    }

    .email-box {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      font-size: 20px;
      border: 2px solid #ccc;
      border-radius: 10px;
      box-sizing: border-box;
    }

    .signup-button {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      background-color: #3878e8;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 25px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="signup">

    <input
      class="name-box"
      type="text"
      placeholder="First name"
    >

    <input
      class="name-box"
      type="text"
      placeholder="First name"
    >

    <input
      class="email-box"
      type="email"
      placeholder="Email"
    >

    <button class="signup-button">
      Sign Up
    </button>

  </div>

</body>

</html>
