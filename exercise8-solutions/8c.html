<!DOCTYPE html>
<html>

<head>
  <title>8c - Google Search</title>

  <style>
    .google {
      text-align: center;
    }

    .logo {
      width: 270px;
      margin-top: 20px;
      margin-bottom: 20px;
    }

    .search-box {
      width: 600px;
      padding: 15px 20px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      outline: none;
    }
  </style>
</head>

<body>

  <div class="google">

    <img class="logo" src="google-logo.png">

    <br>

    <input
      class="search-box"
      type="text"
      placeholder="Search Google or type a URL"
    >

  </div>

</body>

</html>
