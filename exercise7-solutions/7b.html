<!DOCTYPE html>
<html>

<head>
  <title>7b - Square Image</title>

  <style>
    .container {
      width: 300px;
      height: 300px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .cat {
      width: 200px;
      height: 200px;
      object-fit: cover;
    }
  </style>
</head>

<body>

  <div class="container">
    <img class="cat" src="cat.png">
  </div>

</body>

</html>
