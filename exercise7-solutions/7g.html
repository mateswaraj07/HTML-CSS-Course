<!DOCTYPE html>
<html>

<head>
  <title>7g - Twitter Text Box</title>

  <style>
    .tweet-box {
      width: 650px;
      padding: 12px;
      border: 1px solid #ddd;
      font-family: Arial;
    }

    .profile-picture {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 50%;
      vertical-align: middle;
    }

    .tweet-input {
      width: 380px;
      border: none;
      font-size: 22px;
      padding: 15px;
      vertical-align: middle;
      outline: none;
    }

    .tweet-button {
      background-color: #4da3e8;
      color: white;
      border: none;
      border-radius: 25px;
      padding: 12px 22px;
      font-size: 18px;
      font-weight: bold;
      vertical-align: middle;
    }
  </style>
</head>

<body>

  <div class="tweet-box">

    <img
      class="profile-picture"
      src="cat.png"
    >

    <input
      class="tweet-input"
      type="text"
      placeholder="What's happening?"
    >

    <button class="tweet-button">
      Tweet
    </button>

  </div>

</body>

</html>
