<!DOCTYPE html>
<html>

<head>
  <title>7e - Shadow Textbox</title>

  <style>
    .search-box {
      width: 650px;
      padding: 15px 20px;
      font-size: 20px;
      border: none;
      border-radius: 30px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      outline: none;
    }
  </style>
</head>

<body>

  <input
    class="search-box"
    type="text"
    placeholder="Search Google or type a URL"
  >

</body>

</html>
