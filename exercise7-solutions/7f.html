<!DOCTYPE html>
<html>

<head>
  <title>7f - LinkedIn Signup</title>

  <style>
    .signup {
      width: 500px;
      font-family: Arial;
    }

    .email-label {
      display: block;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .email {
      width: 100%;
      height: 35px;
      border: 2px solid #777;
      border-radius: 5px;
      font-size: 18px;
      box-sizing: border-box;
    }

    .privacy {
      font-size: 16px;
      color: #666;
    }

    .join-button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 30px;
      background-color: #2867c7;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="signup">

    <label class="email-label">Email</label>

    <input class="email" type="text">

    <p class="privacy">
      By clicking Agree & Join, you agree to the Privacy Policy.
    </p>

    <button class="join-button">
      Agree & Join
    </button>

  </div>

</body>

</html>
