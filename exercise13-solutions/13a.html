<!DOCTYPE html>
<html>
<head>
  <style>
    .container {
      display: flex;
      width: 300px;
      height: 80px;
    }

    .box1 {
      width: 100px;
      background-color: lightpink;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box2 {
      width: 200px;
      background-color: lightblue;
    }
    .item{
        background-color: black;
        color: white;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="box1">
      <span class="item">item1</span>
    </div>

    <div class="box2"></div>
  </div>

</body>
</html>
