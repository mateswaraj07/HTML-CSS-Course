<!DOCTYPE html>
<html>

<head>

  <title>Gmail Inbox</title>

  <style>

    .inbox {
      width: 400px;
      border: 1px solid #ddd;
      padding: 15px;
      font-family: Arial;
    }

    .title {
      font-size: 12px;
      color: gray;
      margin-bottom: 15px;
    }

    .email {
      display: flex;
      margin-bottom: 18px;
    }

    .profile {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 12px;
    }

    .email-info {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
    }

    .sender {
      font-weight: bold;
    }

    .time {
      color: gray;
      font-size: 12px;
    }

    .subject {
      font-weight: bold;
      font-size: 14px;
      margin-top: 3px;
    }

    .message {
      color: gray;
      font-size: 13px;
      margin-top: 3px;
    }

  </style>

</head>

<body>

  <div class="inbox">

    <div class="title">
      ALL INBOXES
    </div>


    <!-- Chewy Email -->

    <div class="email">

      <img class="profile" src="image.png">

      <div class="email-info">

        <div class="top-row">
          <div class="sender">Chewy Promotions</div>
          <div class="time">4:58 PM</div>
        </div>

        <div class="subject">
          Biggest sales of the year!
        </div>

        <div class="message">
          Hey there! We're writing to tell you about our...
        </div>

      </div>

    </div>


    <!-- Best Buy Email -->

    <div class="email">

      <img class="profile" src="image.png">

      <div class="email-info">

        <div class="top-row">
          <div class="sender">Best Buy</div>
          <div class="time">12:32 PM</div>
        </div>

        <div class="subject">
          Your Best Buy eReceipt
        </div>

        <div class="message">
          Thank you for shopping at Best Buy, here is...
        </div>

      </div>

    </div>


    <!-- Netflix Email -->

    <div class="email">

      <img class="profile" src="image.png">

      <div class="email-info">

        <div class="top-row">
          <div class="sender">Netflix</div>
          <div class="time">9:00 AM</div>
        </div>

        <div class="subject">
          Here's what's coming soon to Netflix
        </div>

        <div class="message">
          Brand new movies and shows, old favorites...
        </div>

      </div>

    </div>

  </div>

</body>

</html>
