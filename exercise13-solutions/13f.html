<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tweet Card Flexbox Layout</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f8fa;
      padding: 20px;
    }

    /* Outer Container: Horizontal Layout */
    .tweet-card {
      display: flex;
      flex-direction: row;
      background-color: #ffffff;
      width: 450px;
      padding: 12px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    /* Profile Image */
    .profile-pic {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      margin-right: 12px;
      object-fit: cover;
    }

    /* Main Content Column: Vertical Layout */
    .tweet-content {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    /* Header Row */
    .author-info {
      margin-bottom: 4px;
    }

    .author-name {
      font-weight: bold;
      color: #0f1419;
    }

    .author-handle {
      color: #536471;
      font-size: 14px;
    }

    /* Tweet Body */
    .tweet-text {
      font-size: 15px;
      line-height: 1.3;
      margin: 0 0 10px 0;
      color: #0f1419;
    }

    /* Link Preview Container: Horizontal Layout */
    .preview-card {
      display: flex;
      flex-direction: row;
      border: 1px solid #cfd9de;
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
    }

    /* Left side of Preview Card */
    .preview-thumbnail {
      width: 100px;
      background-color: #d0d0d0;
      flex-shrink: 0;
    }

    /* Right side of Preview Card: Vertical Layout */
    .preview-info {
      display: flex;
      flex-direction: column;
      padding: 12px;
      background-color: #f7f9f9;
      flex: 1;
    }

    .preview-domain {
      font-size: 14px;
      color: #536471;
      margin-bottom: 4px;
    }

    .preview-title {
      font-size: 14px;
      color: #0f1419;
      line-height: 1.2;
    }
  </style>
</head>
<body>

  <!-- Outer Flexbox Container (Row) -->
  <div class="tweet-card">
    <img class="profile-pic" src="image.png" alt="Profile Picture">

    <!-- Inner Flexbox Column -->
    <div class="tweet-content">
      <div class="author-info">
        <span class="author-name">supersimple.dev</span>
        <span class="author-handle">@SuperSimpleDev</span>
      </div>

      <p class="tweet-text">
        What is backend web development? A complete overview. New video is up!
      </p>

      <!-- Nested Flexbox Row (Link Preview) -->
      <a href="#" class="preview-card">
        <div class="preview-thumbnail"></div>
        
        <!-- Nested Flexbox Column (Preview Details) -->
        <div class="preview-info">
          <span class="preview-domain">youtube.com</span>
          <span class="preview-title">Backend web development - a complete overview (2021)</span>
        </div>
      </a>
    </div>
  </div>

</body>
</html>
