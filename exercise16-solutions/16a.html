<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      font-family: Arial;
    }

    .header {
      height: 60px;
      background-color: white;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.2);

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 50px;
    }

    .icon-container {
      position: relative;
      display: inline-block;
    }

    .icon {
      font-size: 25px;
      cursor: pointer;
    }

    .tooltip {
      position: absolute;
      bottom: -35px;
      left: 50%;
      transform: translateX(-50%);

      background-color: black;
      color: white;

      padding: 6px 10px;
      border-radius: 3px;

      font-size: 12px;
      white-space: nowrap;

      opacity: 0;
      pointer-events: none;

      transition: opacity 0.2s;
    }

    .icon-container:hover .tooltip {
      opacity: 1;
    }
  </style>
</head>

<body>

  <div class="header">

    <div class="icon-container">
      <div class="icon">🏠</div>
      <div class="tooltip">Home</div>
    </div>

    <div class="icon-container">
      <div class="icon">🔔</div>
      <div class="tooltip">Notifications</div>
    </div>

    <div class="icon-container">
      <div class="icon">✉️</div>
      <div class="tooltip">Messages</div>
    </div>

  </div>

</body>
</html>
